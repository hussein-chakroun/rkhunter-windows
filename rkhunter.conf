# Rootkit Hunter for Windows. Paths are relative to this configuration file.
# Use rkhunter.conf.local or rkhunter.d/*.conf for local overrides.
DBDIR=var/lib/rkhunter
LOGFILE=var/log/rkhunter.log
ENABLE_TESTS=all
DISABLE_TESTS=none
# FILE is repeatable; directories are intentionally not recursively baselined.
FILE=%SystemRoot%/System32/cmd.exe
FILE=%SystemRoot%/System32/WindowsPowerShell/v1.0/powershell.exe
FILE=%SystemRoot%/System32/drivers/etc/hosts
FILE=%SystemRoot%/System32/ntoskrnl.exe
FILE=%SystemRoot%/System32/services.exe
FILE=%SystemRoot%/System32/lsass.exe
FILE=%SystemRoot%/System32/svchost.exe
FILE=%SystemRoot%/System32/winlogon.exe
FILE=%SystemRoot%/System32/ntdll.dll
# Bounded, nonrecursive inspections; reparse points are never followed.
SCAN_DIR=%SystemRoot%/Temp
SCAN_DIR=%TEMP%
SCAN_DIR=%SystemRoot%/System32/drivers
MAX_FILES=3000
CHECK_SIGNATURES=1
# Exact subjects or wildcard patterns. Matching warnings are retained as Allowed.
# ALLOW=services|ExampleService
# ALLOW=ports|TCP:6667:*
# No update source is trusted by default. Set a local directory explicitly.
# UPDATE_SOURCE=C:/trusted/rkhunter-data
